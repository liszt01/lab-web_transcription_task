<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>文字入力タスク</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="waiting-screen" class="screen" aria-labelledby="app-title">
        <div class="card waiting-card">
          <p class="eyebrow">TRANSCRIPTION TASK</p>
          <h1 id="app-title">文字入力タスク</h1>
          <label for="participant-id">参加者 ID</label>
          <input id="participant-id" type="text" autocomplete="off" autocapitalize="off" placeholder="ID を入力" />
          <button id="start-button" class="primary">Start</button>
        </div>
      </section>

      <section id="task-screen" class="screen" hidden aria-live="polite">
        <div class="card task-card">
          <div class="progress-row"><span id="progress-label"></span><button id="task-cancel" class="text-button">Cancel</button></div>
          <div class="phrase-block">
            <p id="prompt-text" class="prompt"></p>
            <p id="prompt-kana" class="kana"></p>
          </div>
          <label class="sr-only" for="transcription-input">入力欄</label>
          <textarea id="transcription-input" rows="3" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="ここをタップして入力"></textarea>
          <div id="colored-output" class="colored-output" hidden aria-label="色分けされた入力結果"></div>
          <div id="metrics" class="metrics" hidden></div>
          <div class="actions"><button id="action-button" class="primary">Submit</button><button id="result-cancel" class="secondary" hidden>Cancel</button></div>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
